[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langsmith[openai-agents]>=0.10.10",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E501"]
