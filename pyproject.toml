[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "langsmith[openai-agents]>=0.10.10",
    "ollama>=0.6.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.26",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/ch01_hello_chain.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call a real, locally running model (e.g. Ollama) or real external APIs (OpenAI, Tavily) — excluded by default in CI",
]

[tool.pyright]
include = ["examples", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
